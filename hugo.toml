baseURL = 'https://ramanbhalla.com/'
languageCode = 'en-us'
title = 'Connected Boxes'
theme = 'hugo-book'

# Standard markdown rendering
[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

# Standard Hugo-Book parameters
[params]
  # Basic Metadata
  author = 'Raman Bhalla'
  description = 'Dad | Learner | Advisor'

  # Options: "light", "dark", "auto"
  BookTheme = 'auto'

  # Sidebar Search
  BookSearch = true

  # Right-hand Table of Contents
  BookToC = true

  # Renders all sections in the sidebar menu
  BookSection = '*'

# Standard sidebar menu links
[menu]
  [[menu.after]]
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.after]]
    name = "GitHub"
    url = "https://github.com/rdbhalla"
    weight = 20
  [[menu.after]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/raman-bhalla"
    weight = 30
